# Package-manager settings only; this repository contains one root package.
# Dependency engine ranges may omit Node 25; validate compatibility with the suite.
# The root package's Node/pnpm engine requirements remain enforced by pnpm.
engineStrict: false
strictPeerDependencies: false
allowBuilds:
  '@parcel/watcher@2.6.0': true
  esbuild: true
  '@moonrepo/cli': true
  'electron@23.3.13': true
  # Funding notices and generic browser-driver downloads are unnecessary for embedded Tauri.
  'core-js@3.50.0': false
  'edgedriver@6.3.1': false
  'geckodriver@6.1.1': false
# Validation must use the explicit, reproducible installation step.
verifyDepsBeforeRun: error
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/react-query@5.104.4'
  - i18next@26.5.2
  - react-i18next@17.1.0
