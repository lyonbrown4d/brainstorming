$schema: https://moonrepo.dev/schemas/project.json
layer: application
language: typescript
fileGroups:
  source:
    - src/**/*
    - '!src/generated/**'
    - src-tauri/src/**/*
    - src-tauri/tests/**/*
    - src-tauri/plugins/**/*
    - '!src-tauri/plugins/**/target/**'
    - src-tauri/capabilities/**/*
    - src-tauri/icons/**/*
    - src-tauri/build.rs
    - src-tauri/*.plist
    - src-tauri/*.toml
    - src-tauri/*.json
    - src-tauri/Cargo.lock
    - tests/**/*
    - stories/**/*
    - .storybook/**/*
    - config/**/*
    - scripts/**/*
    - .moon/*.yml
    - .github/workflows/*.yml
    - docs/**/*.md
    - '*.ts'
    - '*.json'
    - '*.yml'
    - '*.md'
    - pnpm-lock.yaml
tasks:
  bindings:
    command: pnpm generate:bindings
    inputs: ['src-tauri/src/**/*', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock']
    outputs: ['src/generated/native.ts']
  format:
    command: pnpm format:check
    inputs: ['@group(source)']
    deps: [bindings]
  lint:
    command: pnpm lint
    inputs: ['@group(source)']
    deps: [bindings]
  typecheck:
    command: pnpm typecheck
    inputs: ['@group(source)']
    deps: [bindings]
  test:
    command: pnpm test
    inputs: ['@group(source)']
    deps: [bindings]
  build:
    command: pnpm build
    inputs: ['@group(source)']
    deps: [typecheck]
    outputs: [dist]
  package:
    inputs: ['@group(source)']
    command: pnpm package
    deps: [build]
    options:
      cache: false
  build-e2e:
    inputs: ['@group(source)']
    command: pnpm build:e2e
    deps: [typecheck]
    options:
      cache: false
  e2e:
    inputs: ['@group(source)']
    command: pnpm test:e2e
    deps: [build-e2e]
    options:
      cache: false
  native-test:
    inputs: ['@group(source)']
    command: pnpm test:rust --locked
    options:
      cache: false
  desktop-test:
    inputs: ['@group(source)']
    command: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets --features e2e
    deps: [build]
    options:
      cache: false
  desktop-check:
    inputs: ['@group(source)']
    command: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features e2e -- -D warnings
    deps: [build]
    options:
      cache: false
  storybook-build:
    command: pnpm build-storybook
    inputs: ['@group(source)']
    deps: [bindings]
    outputs: [storybook-static]
  canvas-test:
    command: pnpm test:canvas
    inputs: ['@group(source)']
    deps: [storybook-build]
    options:
      cache: false
  check:
    inputs: ['@group(source)']
    deps: [format, lint, typecheck, test, build]
    options:
      cache: false
