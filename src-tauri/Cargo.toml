[package]
name = "brainstorming-native"
default-run = "brainstorming-native"
version = "0.2.0"
description = "Local-first cross-platform mind mapping"
edition = "2024"
rust-version = "1.99.1"
license = "UNLICENSED"

[[bin]]
name = "brainstorming-native"
path = "src/main.rs"
required-features = ["native-ui"]

[[bin]]
name = "generate-bindings"
path = "src/bin/generate_bindings.rs"
required-features = ["native-ui"]

[[bin]]
name = "brainstorming-thumbnailer"
path = "src/bin/thumbnailer.rs"

[lib]
name = "brainstorming_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native-ui"]
native-ui = ["dep:tauri3-specta", "dep:specta-typescript", "dep:fluxdi", "dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-fs", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-os", "dep:tauri-plugin-log", "dep:tauri-plugin-window-state", "dep:tauri-plugin-notification", "dep:tauri-plugin-brainstorming-native", "dep:tauri-plugin-single-instance", "dep:tauri-runtime-cef", "dep:tauri-runtime-wry"]
e2e = ["native-ui", "tauri-plugin-brainstorming-native/e2e"]

[build-dependencies]
serde_json = "1.0.154"
pkg-config = "0.3.34"
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.5", optional = true, features = [] }
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", optional = true }
tauri-plugin-opener = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-clipboard-manager = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-fs = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-deep-link = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-os = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-log = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-notification = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-brainstorming-native = { path = "plugins/brainstorming-native", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
futures-util = "0.3.34"
d3-hierarchy = "0.1.1"
# Tauri 3 bindings use the published alpha adapter; keep its Specta versions aligned.
specta = { version = "=2.0.0-rc.27", features = ["derive", "serde_json"] }
tauri3-specta = { version = "=0.1.0-alpha.3", optional = true }
specta-typescript = { version = "0.0.14", optional = true }
zip = { version = "9.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42.0"
pulldown-cmark = "0.13.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# SQLx 0.9 requires libsqlite3-sys <0.38; use its latest compatible stable release.
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
bytes = "1.12.1"
sha2 = "0.11.1"
digest-io = "0.1.0"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
axum = "0.8.9"
subtle = "2.6.1"
tempfile = "3.27.0"
chrono = { version = "0.4.45", features = ["serde"] }
# Keep Rust tracing events on the official log backend without a second subscriber.
tracing = { version = "0.1.44", features = ["log"] }
infer = "0.22.0"
imagesize = "0.15.0"
png = "0.18.1"
# Mature pure-Rust SVG renderer and bounded image codecs for native exports.
resvg = "0.48.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
mime_guess = "2.0.5"
http-range = "0.1.6"
lol_html = "3.0.2"
scraper = "0.29.0"
regex = "1.13.1"
unicode-segmentation = "1.13.3"
icu_segmenter = { version = "2.4.0", features = ["compiled_data", "auto"] }
base64 = "0.23.1"
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tower = { version = "0.5.3", features = ["util"] }
moka = { version = "0.12.16", default-features = false, features = ["future"] }
fluxdi = { version = "=2.0.0", optional = true, default-features = false, features = ["thread-safe", "async-factory", "lifecycle", "macros"] }
svg2pdf = "0.13.0"
# svg2pdf 0.13 exposes pdf-writer 0.12 Chunk/Ref types used by our PDF composition.
pdf-writer = "0.12.1"
docx-rs = { version = "0.4.22", default-features = false }
ppt-rs = { version = "0.2.37", default-features = false, features = ["pdf-native"] }
csv = "1.4.0"
same-file = "1.0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-single-instance = { version = "=3.0.0-alpha.3", optional = true }
tauri-plugin-window-state = { version = "=3.0.0-alpha.2", optional = true }
clipboard-rs = "0.3.5"
keyring = { version = "4.2.0", features = ["v1"] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies.tauri-runtime-cef]
version = "=3.0.0-alpha.6"
optional = true

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies.tauri-runtime-wry]
version = "=3.0.0-alpha.5"
optional = true

[dev-dependencies]
lopdf = "0.46"
proptest = "1.12.0"

# Reduce development archive I/O while retaining file/line backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
