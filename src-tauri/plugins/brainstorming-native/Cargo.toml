[package]
name = "tauri-plugin-brainstorming-native"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-brainstorming-native"
license = "UNLICENSED"

[features]
e2e = ["dep:gtk"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
tauri = "2.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dependencies.base64]
version = "0.23.1"

[dependencies.url]
version = "2.5.8"

[dependencies.tokio]
version = "1.54.1"
features = ["sync", "time"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "block2"] }
objc2-app-kit = { version = "0.3.2", features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSError"] }
block2 = "0.6.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
gtk = { version = "0.18.2", optional = true }
