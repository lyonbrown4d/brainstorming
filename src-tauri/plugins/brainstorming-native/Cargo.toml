[package]
name = "tauri-plugin-brainstorming-native"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-brainstorming-native"
license = "UNLICENSED"

[features]
e2e = []

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "tiff"] }
tauri = "=3.0.0-alpha.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
tauri-plugin = { version = "=3.0.0-alpha.4", features = ["build"] }

[dependencies.base64]
version = "0.23.1"

[dependencies.url]
version = "2.5.8"

[dependencies.tokio]
version = "1.54.1"
features = ["sync", "time"]

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-runtime-cef = "=3.0.0-alpha.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSWindow", "NSButton", "NSApplication"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSThread"] }
