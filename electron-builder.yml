appId: app.trelyx.desktop
productName: Trelyx
copyright: Copyright © 2026 Trelyx contributors
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
fileAssociations:
  - ext: trelyx
    name: Trelyx 思维导图
    mimeType: application/vnd.trelyx+zip
    role: Editor
  - ext: xmind
    name: XMind 思维导图
    role: Viewer
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Office
  target:
    - AppImage
