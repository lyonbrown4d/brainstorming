appId: app.brainstorming.desktop
productName: Brainstorming
copyright: Copyright © 2026 Brainstorming contributors
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
fileAssociations:
  - ext: brainstorming
    name: Brainstorming 思维导图
    mimeType: application/vnd.brainstorming+zip
    role: Editor
  - ext: xmind
    name: XMind 思维导图
    role: Viewer
mac:
  extendInfo:
    NSMicrophoneUsageDescription: 在你点击录音时录制主题的语音备注。
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Office
  target:
    - AppImage
