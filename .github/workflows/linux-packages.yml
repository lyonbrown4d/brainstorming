name: Linux packages
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    name: Linux x86_64 (deb, rpm, AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build libgtk-4-dev libxdo-dev libssl-dev librsvg2-dev libvips-dev patchelf
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm package:linux
      - name: Inspect Debian package
        run: |
          dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
          dpkg-deb --contents src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: brainstorming-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
