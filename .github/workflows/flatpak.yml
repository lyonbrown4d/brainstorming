name: Flatpak package
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  flatpak:
    name: Linux x86_64 (.flatpak)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: tauri-cef-linux-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.toml') }}
      - name: Install Linux and Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build libgtk-4-dev libxdo-dev libssl-dev librsvg2-dev libvips-dev patchelf flatpak flatpak-builder dpkg-dev desktop-file-utils appstream
      - name: Install GNOME runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm tsx scripts/build-flatpak.ts
      - uses: actions/upload-artifact@v4
        with:
          name: brainstorming-linux-x86_64-flatpak
          if-no-files-found: error
          path: src-tauri/target/release/bundle/flatpak/*.flatpak
