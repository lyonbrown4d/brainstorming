<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Trelyx — 正在启动</title>
    <link rel="stylesheet" href="/src/styles/ui.css" />
  </head>
  <body class="m-0 bg-muted">
    <section
      id="startup-screen"
      aria-label="启动 Trelyx"
      aria-busy="true"
      class="fixed inset-0 z-[100] grid place-items-center bg-muted font-sans text-foreground"
    >
      <div class="absolute inset-x-0 top-0 h-12 [-webkit-app-region:drag]" aria-hidden="true"></div>
      <button
        id="startup-quit"
        type="button"
        disabled
        aria-label="退出 Trelyx"
        class="absolute top-3 right-3 grid size-7 place-items-center rounded-md text-muted-foreground [-webkit-app-region:no-drag] hover:bg-accent focus-visible:outline-2 focus-visible:outline-ring disabled:opacity-40"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </button>
      <div class="flex flex-col items-center px-6 text-center">
        <div class="mb-6 grid size-20 place-items-center rounded-3xl bg-primary/10 text-primary">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="16" y="16" width="6" height="6" rx="1" />
            <rect x="2" y="16" width="6" height="6" rx="1" />
            <rect x="9" y="2" width="6" height="6" rx="1" />
            <path d="M5 16v-4h14v4M12 12V8" />
          </svg>
        </div>
        <h1 class="text-3xl font-semibold tracking-tight">Trelyx</h1>
        <div
          id="startup-indicator"
          class="mt-10 flex gap-1.5 motion-safe:animate-pulse"
          aria-hidden="true"
        >
          <span class="size-1.5 rounded-full bg-primary/40"></span>
          <span class="size-1.5 rounded-full bg-primary/70"></span>
          <span class="size-1.5 rounded-full bg-primary"></span>
        </div>
        <p id="startup-message" role="status" class="mt-4 text-sm text-muted-foreground">
          正在准备工作空间…
        </p>
        <button
          id="startup-retry"
          type="button"
          hidden
          class="mt-5 rounded-md border border-border bg-background px-4 py-2 text-sm font-medium hover:bg-accent focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring"
        >
          重新加载
        </button>
        <noscript>
          <p class="mt-4 text-sm text-destructive">请启用 JavaScript 后重新打开 Trelyx。</p>
        </noscript>
      </div>
    </section>
    <script type="module" src="/src/splash.ts"></script>
  </body>
</html>
