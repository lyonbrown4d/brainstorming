<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Brainstorming — 正在启动</title>
    <link rel="stylesheet" href="/src/styles/ui.css" />
    <link rel="stylesheet" href="/src/styles/startup.css" />
  </head>
  <body class="m-0 bg-muted">
    <div id="splash-root">
      <section
        id="startup-screen"
        aria-label="启动 Brainstorming"
        aria-busy="true"
        data-state="loading"
        class="startup-screen"
      >
        <div data-tauri-drag-region class="startup-drag-region" aria-hidden="true"></div>
        <button
          id="startup-quit"
          type="button"
          disabled
          aria-label="退出 Brainstorming"
          class="startup-quit"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
        <div class="startup-surface">
          <header class="startup-brand">
            <span class="startup-logo" aria-hidden="true">
              <img
                src="/src/assets/brand/logo-compact-light.png"
                width="128"
                height="128"
                alt=""
                draggable="false"
                class="startup-logo-light"
              />
              <img
                src="/src/assets/brand/logo-compact-dark.png"
                width="128"
                height="128"
                alt=""
                draggable="false"
                class="startup-logo-dark"
              />
            </span>
            <h1>Brainstorming</h1>
          </header>
          <div class="startup-canvas" aria-hidden="true">
            <img
              src="/src/assets/brand/loading-map.svg"
              width="264"
              height="132"
              alt=""
              class="startup-map"
            />
          </div>
          <footer class="startup-status">
            <div class="startup-status-line">
              <svg
                id="startup-indicator"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M12 2a10 10 0 1 1-7.07 2.93" />
              </svg>
              <p id="startup-message" role="status" aria-live="polite">正在准备工作空间…</p>
            </div>
            <button id="startup-retry" type="button" hidden class="startup-retry">重新加载</button>
            <noscript><p>请启用 JavaScript 后重新打开 Brainstorming。</p></noscript>
          </footer>
        </div>
      </section>
    </div>
    <script type="module" src="/src/splash.tsx"></script>
  </body>
</html>
